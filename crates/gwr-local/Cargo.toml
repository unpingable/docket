[package]
name = "gwr-local"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gwr-core = { path = "../gwr-core" }
gwr-runtime = { path = "../gwr-runtime" }
hmac = "0.12"
libc = "0.2"
# Wire-format adapters only: Ed25519 verification of canonical governed-loop
# V2 issuances and externally verified execution-standing records (ring), plus
# strict decoding of those wire records (serde). The Store substrate remains
# explicit and length-prefixed rather than serde-derived.
ring = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
ring = "0.17"
serde_json = "1"

[lints]
workspace = true
